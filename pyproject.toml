[project]
name = "docingest"
version = "0.1.0"
description = "Turn PDFs, DOCX files and scans into clean, indexed, citable chunks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-docx>=1.1",
    "ragchat",
    "shared",
]

[tool.uv.sources]
shared = { path = "../_shared", editable = true }
ragchat = { path = "../foundationrag-chatbot", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: needs the tesseract binary (brew install tesseract)",
    "live: calls a real chat and embedding model (needs LLM_BASE_URL, LLM_API_KEY, LLM_MODEL and EMBED_MODEL)",
]
addopts = "-m 'not live'"
